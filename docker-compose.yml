# Local mail server for development. Catches every email the API sends.
#   docker compose up -d
#   inbox: http://localhost:8025
# Matching .env: SMTP_HOST=127.0.0.1, SMTP_PORT=1025, SMTP_SECURE=false
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: hello-world-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
